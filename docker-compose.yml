services:
  postgres:
    image: postgres:17

    container_name: incident-postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: incidents

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .

    container_name: incident-api

    ports:
      - "8000:8000"

    depends_on:
      - postgres
volumes:
  postgres_data:
