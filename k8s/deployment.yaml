apiVersion: apps/v1

kind: Deployment

metadata:
  name: incident-api


spec:

  replicas: 2


  selector:
    matchLabels:
      app: incident-api


  template:

    metadata:
      labels:
        app: incident-api


    spec:

      containers:

      - name: incident-api

        image: kappadaniel/incidnet-management-platform:latest
        
        env:
        - name: POSTGRES_USER
          valueFrom: 
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER

        - name: POSTGRES_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD

        -name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST

        -name: DB_PORT
          valueFrom:
          configMapKeyRef:
            name: app-config
            key: DB_PORT

        -name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        ports:
          - containerPort: 8000
  
